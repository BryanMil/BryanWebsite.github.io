<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - Bryan's Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#080a11',
                        cardBg: '#111524',
                        accentBlue: '#2563eb',
                        glowBlue: '#3b82f6',
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 4s ease-in-out infinite alternate',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%': { opacity: '0.3', transform: 'scale(1)' },
                            '100%': { opacity: '0.6', transform: 'scale(1.1)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom styles matching index.html theme */
        body {
            background-color: #07090e;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        .bg-gradient-radial {
            background: radial-gradient(circle at 50% 20%, rgba(37, 99, 235, 0.15) 0%, rgba(15, 23, 42, 0) 70%);
        }

        .grid-pattern {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        .glass-nav {
            background: rgba(13, 17, 28, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(17, 21, 36, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .glass-card:hover {
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(37, 99, 235, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .glow-button {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.4);
            transition: all 0.3s ease;
        }

        .glow-button:hover {
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.7);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative selection:bg-blue-600 selection:text-white">

    <!-- Ambient Background Effects -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[1000px] h-[500px] bg-gradient-radial animate-pulse-glow"></div>
        <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-blue-600/10 blur-[120px] rounded-full"></div>
        <div class="absolute inset-0 grid-pattern opacity-60"></div>
    </div>

    <!-- Navigation Bar -->
    <header class="relative z-50 pt-6 px-4 sm:px-8">
        <div class="max-w-xl mx-auto flex items-center justify-center glass-nav rounded-full px-3 py-2">
            <!-- Centered Navigation Links -->
            <nav class="flex items-center gap-1 bg-white/5 p-1 rounded-full border border-white/5">
                <a href="index.html" class="px-5 py-1.5 rounded-full text-xs font-medium text-gray-400 hover:text-white transition-colors">
                    Home
                </a>
                <a href="Videos.html" class="px-5 py-1.5 rounded-full text-xs font-medium text-gray-400 hover:text-white transition-colors">
                    Video Portfolio
                </a>
                <a href="about.html" class="px-5 py-1.5 rounded-full text-xs font-semibold text-white bg-white/10 shadow-sm border border-white/10 transition-all hover:bg-white/15">
                    Resume
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="relative z-10 flex-grow flex flex-col items-center justify-center px-4 py-12 sm:py-16">
        
        <!-- Header Pill Badge -->
        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full glass-nav text-xs sm:text-sm text-gray-300 border border-white/10 mb-6 animate-float">
            <span class="text-gray-400">Professional Experience & Skills</span>
            <span class="bg-blue-500/20 text-blue-300 border border-blue-500/30 px-2.5 py-0.5 rounded-full font-medium flex items-center gap-1 text-xs">
                <i class="fa-solid fa-file-user text-[10px]"></i> Resume
            </span>
        </div>

        <!-- Page Title -->
        <h1 class="text-4xl sm:text-5xl md:text-6xl font-extrabold text-center tracking-tight text-white max-w-4xl leading-[1.15] mb-8">
            Curriculum <span class="bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Vitae</span>
        </h1>

        <!-- Resume Image Showcase Container -->
        <div class="w-full max-w-4xl transition-all duration-500">
            <div class="glass-card rounded-2xl sm:rounded-3xl p-3 sm:p-5 transition-all duration-300">
                <div class="relative rounded-xl sm:rounded-2xl overflow-hidden bg-slate-900 border border-white/10">
                    <img 
                        src="./Images/RH Resume2.jpg" 
                        alt="Bryan Resume" 
                        class="w-full h-auto object-cover rounded-lg shadow-2xl"
                    />
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="relative z-10 py-8 px-4 border-t border-white/5 text-center">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-gray-500">
            <p>© 2026 Bryan. All rights reserved.</p>
            <div class="flex items-center gap-6">
                <a href="index.html" class="hover:text-gray-300 transition-colors">Home</a>
                <a href="Videos.html" class="hover:text-gray-300 transition-colors">Video Portfolio</a>
                <a href="about.html" class="hover:text-gray-300 transition-colors">Resume</a>
            </div>
        </div>
    </footer>

</body>
</html>
