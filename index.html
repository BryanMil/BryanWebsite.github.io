<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bryan's Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0a0d14;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --pill-bg: rgba(255, 255, 255, 0.06);
      --pill-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 20% 40%, rgba(99, 102, 241, 0.08) 0%, transparent 40%);
      color: var(--text-main);
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      padding: 30px 20px 10px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    /* Pill-style top navigation bar */
    .nav-container {
      display: inline-flex;
      align-items: center;
      background: rgba(18, 24, 38, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px 12px;
      border-radius: 9999px;
      border: 1px solid var(--pill-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      margin-bottom: 25px;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 9999px;
      transition: all 0.2s ease;
    }

    nav a:hover {
      color: var(--text-main);
      background: var(--pill-bg);
      text-decoration: none;
    }

    header h1 {
      margin: 10px 0 0 0;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(180deg, #FFFFFF 0%, #CBD5E1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Badge below heading */
    .badge-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      border-radius: 9999px;
      font-size: 13px;
      color: var(--text-muted);
    }

    main {
      padding: 20px 20px 40px;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }

    /* Card container for the image */
    .image-card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .image-card:hover {
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }

    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
    }

    footer {
      padding: 30px 20px;
      font-size: 13px;
      color: #64748b;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="nav-container">
      <nav>
        <a href="./Videos.html">Video Portfolio</a>
        <a href="./about.html">Resume</a>
      </nav>
    </div>

    <h1>Bryan's Portfolio</h1>

    <div class="badge-bar">
      <span class="badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 10l5 5-5 5"/><path d="M4 4v7a4 4 0 0 0 4 4h12"/></svg>
        Featured Projects
      </span>
    </div>
  </header>

  <main>
    <div class="image-card">
      <img src="./Images/Travis Heights.jpg" alt="Travis Heights">
    </div>
  </main>

  <footer>
    © 2026 Bryan. All rights reserved.
  </footer>

</body>
</html>
